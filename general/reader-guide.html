<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고 줄여서 보는 법</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:type" content="website">
<meta property="og:title" content="광고 줄여서 보는 법">
<meta property="og:description" content="원문 기사를 광고 적게 보는 방법">
<meta property="og:image" content="https://sunho810204-cell.github.io/metax-news/general/2026-11-14/card.png">
<meta property="og:url" content="https://sunho810204-cell.github.io/metax-news/general/reader-guide.html">
<style>
:root{--bg:#fff;--card:#f6f7fa;--fg:#14213d;--muted:#586174;--line:#d9dce3;--accent:#c8102e;--navy:#14213d}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;overflow-wrap:break-word;padding:20px 16px 56px}
main{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{font-size:.85rem;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:10px}
.kicker:before{content:"";width:28px;height:4px;background:var(--accent);display:inline-block}
h1{font-size:1.9rem;line-height:1.25;margin:8px 0 2px;text-wrap:balance}
.sub{color:var(--muted);text-wrap:balance}
.logo{flex:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.logo img{height:46px;display:block}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-height:44px}
a.card:active{background:#eceef3}
.chip{display:inline-block;font-size:.8rem;font-weight:700;color:#fff;background:var(--navy);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.card h2,.art h2{font-size:1.15rem;line-height:1.4;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:.95rem;margin:0}
.more{color:var(--accent);font-weight:700;font-size:.9rem;margin-top:6px;display:block}
.art{border:1px solid var(--line);border-radius:14px;padding:20px}
.art h1{font-size:1.45rem;margin:4px 0 10px}
.art ul{margin:10px 0;padding-left:1.2em}
.art li{margin:6px 0}
.note{background:#fff8e6;border:1px solid #ecd9a0;border-radius:10px;padding:10px 12px;font-size:.92rem;margin-top:12px}
.src{color:var(--muted);font-size:.9rem;margin-top:12px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--navy);color:var(--navy);text-decoration:none;font-weight:500;margin-top:6px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btn.fill{background:var(--navy);color:#fff}
.small{color:var(--muted);font-size:.82rem}
.foot a,.small a{color:var(--navy)}
.foot{color:var(--muted);font-size:.82rem;line-height:1.6;text-wrap:balance}
@media (max-width:380px){body{font-size:16px}h1{font-size:1.6rem}}
</style></head><body><main>
<a class="btn" href="javascript:history.back()">‹ 돌아가기</a><article class="art"><h1>광고 줄여서 보는 법</h1><ul><li>기사 화면의 <b>"가벼운 화면으로 원문 보기"</b> 버튼을 먼저 눌러 보세요. 언론사가 제공하는 화면이라 광고가 적어요.</li><li>가벼운 화면이 없는 기사는 폰 인터넷 앱의 <b>읽기 모드(간소화된 보기)</b>를 써 보세요. 주소창 옆이나 메뉴(⋮)에 "읽기 모드" 또는 "간소화된 보기"가 보이면 누르면 글만 깔끔하게 보여요.</li><li>읽기 모드 메뉴는 기사와 폰, 앱 버전에 따라 안 보일 수도 있고 이름이 조금 다를 수 있어요.</li><li>그래도 불편하면 이 페이지의 요약만 읽어도 핵심은 알 수 있어요.</li></ul></article>
</main></body></html>
